[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmai"
version = "0.1.0"
description = "Grand Master AI - a search-free Deep RL chess agent for forced-mate endgames"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luis Miguel Pereira Silva" }]
dependencies = [
  "torch>=2.0",
  "python-chess>=1.10",
  "gymnasium>=0.29",
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "prometheus-client>=0.20",
  "pydantic>=2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "psutil>=5.9",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 90
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI's Depends() idiom relies on calls in defaults
  "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # sys.path juggling before imports
"scripts/*" = ["E402"]

[tool.coverage.run]
source = ["gmai"]
omit = ["*/notebooks/*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
