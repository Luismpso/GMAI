# GMAI - forced-mate endgames.
# Scope: KQ vs K, KR vs K, KRR vs K. Full chess is explicitly out of scope.
seed: 42
episodes: 40000
gamma: 0.90            # horizon 1/(1-g) = 10 steps, matching endgame length.
                       # 0.99 gives a 100-step horizon: mate-in-1 and mate-in-10
                       # then differ by 0.09, which is noise. See docs/POSTMORTEM.md.
lr: 0.00003            # deliberately low: RL here fine-tunes a warm-started
                       # network, and 3e-4 destroyed the policy within ~300
                       # gradient steps
batch_size: 128
learn_start: 5000        # transitions before learning starts. 50000 was tried on
                         # the theory that small-buffer overfitting caused the
                         # post-warm-start collapse; it only delayed training to
                         # episode ~5780 and the collapse was unchanged, so buffer
                         # size is ruled out. See docs/POSTMORTEM.md.
train_every: 8           # env steps per gradient step
target_sync_every: 1000
checkpoint_every: 5000
log_every: 200
run_dir: runs

epsilon:
  start: 1.0
  end: 0.05
  decay_steps: 60000     # endgames are short: decay over steps, not episodes

model:
  channels: 64
  n_blocks: 4
  hidden: 512

replay:
  capacity: 60000        # ~0.6 GB with bit-packed masks. Raise only if you have
                         # the RAM: run scripts/doctor.py to see the projection.
  prioritized: true
  alpha: 0.6
  beta: 0.4

reward:
  shaping: true
  move_limit_is_terminal: true   # in a forced mate, running out of moves is
                                 # failing the task - not a harness cut-off
  potential: endgame     # material + edge-drive + king proximity
  draw: -1.0             # in a forced win a draw IS a loss - do not average it to 0.5

curriculum:
  stages: ["KQvK", "KRvK", "KRRvK"]
  window: 200            # rolling window for the cheap screen
  screen_at: 0.60        # noisy epsilon-greedy screen before paying for a real eval
  eval_every: 200        # episodes between promotion checks
  eval_games: 200        # greedy games in the promotion eval
  promote_at:            # PURE win-rate thresholds to advance a stage
    KQvK: 0.90
    KRvK: 0.80
    KRRvK: 0.80

warmstart:                # supervised bootstrap from the exact solver
  enabled: true
  mode: imitation         # imitation | q_regression - see docs/POSTMORTEM.md
  positions: 20000
  epochs: 16
  batch_size: 256
  lr: 0.001
  ce_weight: 2.0          # q_regression only: ranking term, annealed to zero
  epsilon_after: 0.10     # the policy is no longer random; heavy exploration
                          # here re-randomises what the warm start just learned
  cache_dir: tablebases
